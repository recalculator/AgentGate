name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Exercises the composite action against the demo repo: the action must
  # detect the escalation and fail. Runs static-only, so it needs no API key.
  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo repo
        run: |
          bash scripts/make_demo_repo.sh "${RUNNER_TEMP}/demo"
      - name: Run the action against the escalating commit
        id: gate
        uses: ./
        continue-on-error: true
        with:
          repo-path: ${{ runner.temp }}/demo
          static-only: "true"
          base-ref: main
          head-ref: risky-refactor
          comment: "false"
          commit-status: "false"
          fail-on-block: "false" # we assert on the output instead
      - name: The gate must have blocked
        run: |
          if [ "${{ steps.gate.outputs.verdict }}" != "BLOCKED" ]; then
            echo "expected BLOCKED, got '${{ steps.gate.outputs.verdict }}'" >&2
            exit 1
          fi
          echo "action correctly blocked the escalating commit"
